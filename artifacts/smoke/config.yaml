seed: 42
data:
  manifest: data/processed/manifest.csv
  patch_dir: data/processed/patches
  raw_patch_size: 64
  patch_size: 48
  hu_clip:
  - -1000.0
  - 400.0
  val_fraction: 0.15
  test_fraction: 0.15
  split_by: patient_id
  exclude_ambiguous: true
train:
  batch_size: 32
  epochs: 5
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 3
  amp: true
  num_workers: 0
  balance_classes: true
  early_stop_patience: 12
  monitor: val_auc
model:
  name: resnet3d
  depth: 10
  widths:
  - 16
  - 32
  - 64
  - 128
  dropout: 0.2
augment:
  flip: true
  rot90: true
  intensity_shift: 0.1
  scale:
  - 0.9
  - 1.1
output:
  dir: artifacts
  run_name: smoke
